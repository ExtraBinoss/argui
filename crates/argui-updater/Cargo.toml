[package]
name = "argui-updater"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "UI-independent, signed application updates for Argui"

[[example]]
name = "startup"
required-features = ["native"]

[features]
default = []
native = ["dep:reqwest", "dep:semver", "dep:serde", "dep:serde_json", "dep:minisign-verify", "dep:tempfile", "dep:self-replace", "dep:flate2", "dep:tar"]

[dependencies]
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
minisign-verify = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
self-replace = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

[lints]
workspace = true
