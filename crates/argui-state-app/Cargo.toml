[package]
name = "argui-state-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Packaged Argui state and DevTools showcase"

[[bin]]
name = "argui-state"
path = "src/main.rs"

[dependencies]
argui = { workspace = true, features = ["tray"] }
argui-showcase.workspace = true

[build-dependencies]
winresource.workspace = true

[package.metadata.packager]
product-name = "Argui state showcase"
identifier = "dev.argui.state"
category = "Developer Tool"
before-packaging-command = "cargo build --release -p argui-state-app --bin argui-state"
binaries = [{ path = "argui-state", main = true }]
icons = [
    "assets/icon-32.png",
    "assets/icon-128.png",
    "assets/icon-256.png",
    "assets/icon-512.png",
    "assets/icon.ico",
]

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"

[lints]
workspace = true
