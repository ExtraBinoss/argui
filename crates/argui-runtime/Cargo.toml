[package]
name = "argui-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
tray = ["argui-platform/tray"]
webview = ["dep:argui-webview", "argui-platform/gtk-host", "dep:tao", "dep:gtk"]

[dependencies]
argui-accessibility.workspace = true
argui-inspect.workspace = true
argui-animation.workspace = true
argui-core.workspace = true
argui-layout.workspace = true
argui-paint.workspace = true
argui-platform.workspace = true
argui-render.workspace = true
argui-text.workspace = true
argui-ui.workspace = true
web-time.workspace = true
winit.workspace = true
argui-webview = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tao = { version = "=0.37.0", features = ["rwh_06"], optional = true }
gtk = { version = "=0.18.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit.workspace = true
accesskit_winit.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
