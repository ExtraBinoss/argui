[package]
name = "argui-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native-popups = ["argui-platform/native-popups"]
tasks = ["dep:tokio", "dep:futures-util", "dep:futures-channel", "dep:gloo-timers"]
tray = ["argui-platform/tray"]
webview = ["dep:argui-webview", "argui-platform/gtk-host", "dep:tao", "dep:gtk"]

[dependencies]
argui-accessibility.workspace = true
argui-inspect.workspace = true
argui-animation.workspace = true
argui-core.workspace = true
argui-layout.workspace = true
argui-paint.workspace = true
argui-platform.workspace = true
argui-render.workspace = true
argui-text.workspace = true
argui-ui.workspace = true
web-time.workspace = true
winit.workspace = true
futures-util = { workspace = true, features = ["sink"], optional = true }
futures-channel = { version = "=0.3.34", features = ["sink"], optional = true }
argui-webview = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tao = { version = "=0.37.0", features = ["rwh_06"], optional = true }
gtk = { version = "=0.18.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit.workspace = true
accesskit_winit.workspace = true
pollster.workspace = true
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "net"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
gloo-timers = { version = "=0.3.0", features = ["futures"], optional = true }

[lints]
workspace = true

[[test]]
name = "launch"
harness = false
required-features = ["tasks"]

[[test]]
name = "native_popups"
path = "tests/app/popups.rs"
harness = false
required-features = ["native-popups"]
