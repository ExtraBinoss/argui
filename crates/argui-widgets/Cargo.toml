[package]
name = "argui-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
all = ["button", "input", "checkbox", "switch", "radio-group", "tabs", "select", "popover", "dialog", "range", "slider", "spinner", "text-selection", "split-pane", "vlist", "tree-view", "icons"]
button = []
input = []
checkbox = []
switch = []
radio-group = []
tabs = []
select = ["input"]
popover = []
dialog = []
range = ["dep:argui-runtime"]
slider = ["range"]
spinner = ["dep:argui-runtime"]
text-selection = ["button", "icons", "dep:argui-runtime", "dep:argui-inspect"]
split-pane = []
vlist = []
tree-view = ["vlist", "button"]
icons = ["dep:argui-vector", "dep:icondata_core", "dep:icondata_tb"]

[dependencies]
argui-animation.workspace = true
argui-core.workspace = true
argui-inspect = { workspace = true, optional = true }
argui-paint.workspace = true
argui-runtime = { workspace = true, optional = true }
argui-text.workspace = true
argui-theme.workspace = true
argui-ui.workspace = true
argui-vector = { workspace = true, optional = true }
icondata_core = { workspace = true, optional = true }
icondata_tb = { workspace = true, optional = true }

[lints]
workspace = true
