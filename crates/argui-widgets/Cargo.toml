[package]
name = "argui-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
all = [
    "animated-text",
    "accordion",
    "alert",
    "alert-dialog",
    "aspect-ratio",
    "attachment",
    "avatar",
    "badge",
    "breadcrumb",
    "bubble",
    "button",
    "button-group",
    "calendar",
    "card",
    "carousel",
    "chart",
    "checkbox",
    "collapsible",
    "color-picker",
    "combobox",
    "command-palette",
    "context-menu",
    "data-table",
    "date-picker",
    "dialog",
    "direction",
    "drawer",
    "empty",
    "field",
    "file-picker",
    "hover-card",
    "icons",
    "input",
    "input-group",
    "input-otp",
    "item",
    "kbd",
    "label",
    "list",
    "marker",
    "menu",
    "menubar",
    "message",
    "message-scroller",
    "native-select",
    "navigation-menu",
    "pagination",
    "popover",
    "progress",
    "questionnaire",
    "radio-group",
    "range",
    "scroll-area",
    "select",
    "separator",
    "sheet",
    "sidebar",
    "skeleton",
    "slider",
    "spinner",
    "split-pane",
    "switch",
    "table",
    "tabs",
    "text-selection",
    "textarea",
    "toast",
    "toggle",
    "toggle-group",
    "tooltip",
    "tree-view",
    "typography",
    "vlist",
]
toggle = ["button"]
animated-text = ["dep:argui-runtime", "dep:unicode-segmentation"]
toggle-group = ["toggle"]
accordion = ["collapsible"]
button-group = []
item = []
field = ["label"]
input-group = []
scroll-area = []
typography = []
sheet = ["dialog"]
alert-dialog = ["dialog", "button", "typography"]
combobox = ["select", "button", "scroll-area"]
native-select = ["select"]
input-otp = ["input"]
direction = []
bubble = []
message = []
marker = ["separator", "typography"]
attachment = ["item"]
message-scroller = ["scroll-area", "button"]
hover-card = ["popover"]
navigation-menu = ["popover", "button"]
sidebar = ["sheet", "button"]
drawer = ["sheet", "button"]
carousel = ["button"]
chart = ["button"]
questionnaire = ["toggle", "input", "typography"]
file-picker = ["button", "dep:argui-platform", "argui-platform/file-picker", "dep:argui-runtime", "argui-runtime/tasks"]
label = []
skeleton = ["dep:argui-runtime"]
breadcrumb = ["button"]
pagination = ["button"]
avatar = []
empty = []
kbd = []
aspect-ratio = []
progress = ["dep:argui-runtime"]
badge = []
card = []
alert = []
separator = []
collapsible = ["button"]
data-table = ["table", "input", "checkbox", "button", "split-pane", "icons"]
toast = ["button", "icons"]
date-picker = ["calendar", "input", "popover"]
calendar = ["button", "dep:time"]
menu = ["button", "popover", "icons"]
context-menu = ["menu"]
menubar = ["menu"]
command-palette = ["menu", "input"]
button = []
input = []
textarea = []
checkbox = []
switch = []
radio-group = []
tabs = []
select = ["input"]
popover = []
tooltip = ["dep:argui-runtime", "argui-runtime/tasks", "dep:argui-inspect", "dep:web-time"]
dialog = []
range = ["dep:argui-runtime"]
slider = ["range"]
color-picker = ["range", "input", "button"]
spinner = ["dep:argui-runtime"]
text-selection = ["button", "icons", "dep:argui-runtime", "dep:argui-inspect"]
split-pane = []
list = []
table = ["list"]
vlist = ["list"]
tree-view = ["vlist", "button"]
icons = ["dep:argui-vector", "dep:icondata_core", "dep:icondata_tb"]

[dependencies]
unicode-segmentation = { workspace = true, optional = true }
argui-platform = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
time = { version = "=0.3.44", optional = true, features = ["parsing"] }
argui-animation.workspace = true
argui-core.workspace = true
argui-inspect = { workspace = true, optional = true }
argui-paint.workspace = true
argui-runtime = { workspace = true, optional = true }
argui-text.workspace = true
argui-theme.workspace = true
argui-ui.workspace = true
argui-vector = { workspace = true, optional = true }
icondata_core = { workspace = true, optional = true }
icondata_tb = { workspace = true, optional = true }

[dev-dependencies]
argui-layout.workspace = true

[lints]
workspace = true
