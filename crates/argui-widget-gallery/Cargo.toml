[package]
name = "argui-widget-gallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argui = { workspace = true, features = ["widgets"] }
argui-image.workspace = true
