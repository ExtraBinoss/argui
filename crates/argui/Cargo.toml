[package]
name = "argui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "A modular Rust UI library for fast, accessible native and WebAssembly interfaces"

[features]
default = []
basic = [
    "tasks",
    "widget-button",
    "widget-checkbox",
    "widget-dialog",
    "widget-input",
    "widget-popover",
    "widget-radio-group",
    "widget-select",
    "widget-switch",
    "widget-tabs",
    "widget-textarea",
]
desktop = [
    "basic",
    "desktop-backdrop",
    "file-picker",
    "native-popups",
    "tray",
    "updater",
    "widget-file-picker",
    "widget-updater",
]
web = ["basic", "webview"]
hot-reload = ["argui-runtime/hot-reload"]
i18n = ["dep:argui-i18n"]
updater = ["dep:argui-updater", "argui-updater/native"]
widget-updater = ["argui-widgets/updater"]
file-picker = ["argui-platform/file-picker"]
widget-file-picker = ["argui-widgets/file-picker"]
desktop-backdrop = ["argui-runtime/desktop-backdrop"]
native-popups = ["argui-runtime/native-popups"]
tasks = ["argui-runtime/tasks"]
tray = ["argui-platform/tray", "argui-runtime/tray"]
widgets-all = ["argui-widgets/all"]
widget-toggle = ["argui-widgets/toggle"]
widget-toggle-group = ["argui-widgets/toggle-group"]
widget-accordion = ["argui-widgets/accordion"]
widget-button-group = ["argui-widgets/button-group"]
widget-item = ["argui-widgets/item"]
widget-field = ["argui-widgets/field"]
widget-input-group = ["argui-widgets/input-group"]
widget-scroll-area = ["argui-widgets/scroll-area"]
widget-typography = ["argui-widgets/typography"]
widget-sheet = ["argui-widgets/sheet"]
widget-alert-dialog = ["argui-widgets/alert-dialog"]
widget-combobox = ["argui-widgets/combobox"]
widget-native-select = ["argui-widgets/native-select"]
widget-input-otp = ["argui-widgets/input-otp"]
widget-direction = ["argui-widgets/direction"]
widget-bubble = ["argui-widgets/bubble"]
widget-message = ["argui-widgets/message"]
widget-marker = ["argui-widgets/marker"]
widget-attachment = ["argui-widgets/attachment"]
widget-message-scroller = ["argui-widgets/message-scroller"]
widget-hover-card = ["argui-widgets/hover-card"]
widget-navigation-menu = ["argui-widgets/navigation-menu"]
widget-sidebar = ["argui-widgets/sidebar"]
widget-drawer = ["argui-widgets/drawer"]
widget-carousel = ["argui-widgets/carousel"]
widget-chart = ["argui-widgets/chart"]
widget-questionnaire = ["argui-widgets/questionnaire"]
widget-label = ["argui-widgets/label"]
widget-skeleton = ["argui-widgets/skeleton"]
widget-breadcrumb = ["argui-widgets/breadcrumb"]
widget-pagination = ["argui-widgets/pagination"]
widget-avatar = ["argui-widgets/avatar"]
widget-empty = ["argui-widgets/empty"]
widget-kbd = ["argui-widgets/kbd"]
widget-aspect-ratio = ["argui-widgets/aspect-ratio"]
widget-progress = ["argui-widgets/progress"]
widget-badge = ["argui-widgets/badge"]
widget-card = ["argui-widgets/card"]
widget-alert = ["argui-widgets/alert"]
widget-separator = ["argui-widgets/separator"]
widget-collapsible = ["argui-widgets/collapsible"]
widget-date-picker = ["argui-widgets/date-picker"]
widget-toast = ["argui-widgets/toast"]
widget-calendar = ["argui-widgets/calendar"]
widget-button = ["argui-widgets/button"]
widget-menu = ["argui-widgets/menu"]
widget-context-menu = ["argui-widgets/context-menu"]
widget-menubar = ["argui-widgets/menubar"]
widget-command-palette = ["argui-widgets/command-palette"]
widget-input = ["argui-widgets/input"]
widget-textarea = ["argui-widgets/textarea"]
widget-checkbox = ["argui-widgets/checkbox"]
widget-switch = ["argui-widgets/switch"]
widget-radio-group = ["argui-widgets/radio-group"]
widget-tabs = ["argui-widgets/tabs"]
widget-select = ["argui-widgets/select"]
widget-popover = ["argui-widgets/popover"]
widget-tooltip = ["argui-widgets/tooltip"]
widget-dialog = ["argui-widgets/dialog"]
widget-range = ["argui-widgets/range"]
widget-slider = ["argui-widgets/slider"]
widget-color-picker = ["argui-widgets/color-picker"]
widget-implicit-animation = ["argui-widgets/implicit-animation"]
widget-animated-text = ["argui-widgets/animated-text"]
widget-spinner = ["argui-widgets/spinner"]
widget-text-selection = ["argui-widgets/text-selection"]
widget-split-pane = ["argui-widgets/split-pane"]
widget-list = ["argui-widgets/list"]
widget-data-table = ["argui-widgets/data-table"]
widget-table = ["argui-widgets/table"]
widget-vlist = ["argui-widgets/vlist"]
widget-tree-view = ["argui-widgets/tree-view"]
widget-icons = ["argui-widgets/icons"]
devtools = ["dep:argui-devtools"]
devtools-all-smi = ["devtools", "argui-devtools/all-smi"]
webview = ["dep:argui-webview", "argui-runtime/webview"]

[dependencies]
argui-accessibility.workspace = true
argui-animation.workspace = true
argui-core.workspace = true
argui-devtools = { workspace = true, optional = true }
argui-i18n = { workspace = true, optional = true }
argui-layout.workspace = true
argui-paint.workspace = true
argui-platform.workspace = true
argui-render.workspace = true
argui-runtime.workspace = true
argui-text.workspace = true
argui-theme.workspace = true
argui-ui.workspace = true
argui-updater = { workspace = true, optional = true }
argui-vector.workspace = true
argui-widgets = { workspace = true, optional = true }
argui-webview = { workspace = true, optional = true }

[dev-dependencies]
argui-showcase = { path = "../argui-showcase" }
argui-widgets = { path = "../argui-widgets", features = ["all"] }

[lints]
workspace = true
