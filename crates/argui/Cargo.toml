[package]
name = "argui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
tray = ["argui-platform/tray", "argui-runtime/tray"]
widgets-all = ["argui-widgets/all"]
widget-button = ["argui-widgets/button"]
widget-input = ["argui-widgets/input"]
widget-checkbox = ["argui-widgets/checkbox"]
widget-switch = ["argui-widgets/switch"]
widget-radio-group = ["argui-widgets/radio-group"]
widget-tabs = ["argui-widgets/tabs"]
widget-select = ["argui-widgets/select"]
widget-popover = ["argui-widgets/popover"]
widget-dialog = ["argui-widgets/dialog"]
widget-range = ["argui-widgets/range"]
widget-slider = ["argui-widgets/slider"]
widget-spinner = ["argui-widgets/spinner"]
widget-text-selection = ["argui-widgets/text-selection"]
widget-split-pane = ["argui-widgets/split-pane"]
widget-vlist = ["argui-widgets/vlist"]
widget-tree-view = ["argui-widgets/tree-view"]
widget-icons = ["argui-widgets/icons"]
devtools = ["dep:argui-devtools"]
webview = ["dep:argui-webview", "argui-runtime/webview"]

[dependencies]
argui-accessibility.workspace = true
argui-animation.workspace = true
argui-core.workspace = true
argui-devtools = { workspace = true, optional = true }
argui-layout.workspace = true
argui-paint.workspace = true
argui-platform.workspace = true
argui-render.workspace = true
argui-runtime.workspace = true
argui-text.workspace = true
argui-theme.workspace = true
argui-ui.workspace = true
argui-vector.workspace = true
argui-widgets = { workspace = true, optional = true }
argui-webview = { workspace = true, optional = true }

[dev-dependencies]
argui-devtools.workspace = true
argui-showcase.workspace = true
argui-widgets = { workspace = true, features = ["all"] }

[lints]
workspace = true
