[package]
name = "argui-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Compiler, development host, formatter, and language tooling for Argui DSL"

[[bin]]
name = "argui"
path = "src/main.rs"

[dependencies]
argui-dsl-compiler = { path = "../dsl-compiler" }
argui-dsl-ir = { path = "../dsl-ir" }
argui-dsl-parser = { path = "../dsl-parser" }
argui-dsl-protocol = { path = "../dsl-protocol" }
argui-dsl-semantic = { path = "../dsl-semantic" }
argui-dsl-stdlib = { path = "../stdlib" }
argui-dsl-syntax = { path = "../dsl-syntax" }
argui-schema.workspace = true
notify.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tungstenite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = "3.4"
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }

[dev-dependencies]
argui-dsl-runtime = { path = "../dsl-runtime" }
argui-testing.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["fs", "term"] }

[lints]
workspace = true
