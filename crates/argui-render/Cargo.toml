[package]
name = "argui-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "GPU rendering for Argui native and WebAssembly interfaces"

[dependencies]
argui-core.workspace = true
argui-paint.workspace = true
argui-text.workspace = true
bytemuck.workspace = true
naga.workspace = true
resvg.workspace = true
thiserror.workspace = true
wgpu.workspace = true
web-time.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Foundation"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
objc2 = "=0.6.4"
objc2-core-foundation = "=0.3.2"
objc2-io-surface = "=0.3.2"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

[dev-dependencies]
pollster.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Creates a Wayland window for the native surface integration test.
winit.workspace = true

[[test]]
name = "external_frame"
path = "tests/external_frame/mod.rs"

[[test]]
name = "gpu_canvas"
path = "tests/gpu_canvas/mod.rs"

[[test]]
name = "text_pipeline"
path = "tests/text/pipeline.rs"

[lints]
workspace = true
