[package]
name = "argui-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "GPU rendering for Argui native and WebAssembly interfaces"

[dependencies]
argui-core.workspace = true
argui-paint.workspace = true
argui-shader.workspace = true
argui-text.workspace = true
bytemuck.workspace = true
resvg.workspace = true
wgpu.workspace = true
web-time.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
naga.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Creates a Wayland window for the native surface integration test.
winit.workspace = true

[[test]]
name = "gpu_canvas"
path = "tests/gpu_canvas/mod.rs"

[[test]]
name = "text_pipeline"
path = "tests/text/pipeline.rs"

[lints]
workspace = true
