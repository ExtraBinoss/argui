<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" href="data:," />
    <title>Argui Spotlight</title>
    <style>
      :root {
        color-scheme: light;
        background: #edf3ff;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 16% 18%, #b8d5ff 0, transparent 35%),
          radial-gradient(circle at 84% 74%, #e2c7ff 0, transparent 34%),
          linear-gradient(145deg, #f6f9ff, #eeeafd);
      }
      canvas {
        width: min(704px, calc(100vw - 24px));
        height: min(452px, calc(100vh - 24px));
        display: block;
        border-radius: 24px;
        box-shadow: 0 30px 90px rgb(43 55 86 / 24%);
        touch-action: none;
      }
      #status {
        position: fixed;
        inset: auto 16px 16px;
        color: #4b556d;
        font: 13px/1.4 system-ui, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading Argui Spotlight…</div>
    <script type="module">
      const status = document.querySelector('#status');
      window.addEventListener('argui:renderer-state', event => {
        status.hidden = event.detail.state === 'ready';
      });
      import init from "./pkg/argui_example_spotlight.js";
      init().catch(error => {
        console.error(error);
        status.textContent = String(error);
      });
    </script>
  </body>
</html>
