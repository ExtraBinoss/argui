[package]
name = "argui-example-spotlight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A cross-platform translucent Spotlight launcher built with Argui"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argui = { workspace = true, features = [
    "desktop-backdrop",
    "global-shortcuts",
    "tray",
] }
argui-showcase.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
