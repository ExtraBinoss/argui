[package]
name = "argui-example-astra-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A fast, responsive Rust editor demonstrating application-scale Argui patterns"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argui = { workspace = true, features = [
    "file-picker",
    "tasks",
    "widget-button",
    "widget-icons",
    "widget-input",
    "widget-kbd",
    "widget-split-pane",
    "widget-text-selection",
    "widget-textarea",
    "widget-tooltip",
    "widget-tree-view",
    "widget-vlist",
] }
argui-effects.workspace = true
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tree-sitter-highlight.workspace = true
tree-sitter-rust.workspace = true

[dev-dependencies]
argui-testing.workspace = true
tempfile = "=3.27.0"

[lints]
workspace = true
