[package]
name = "argui-example-ai-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A local 1,000 token/s streaming stress demo for Argui"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argui = { workspace = true, features = [
    "widget-badge",
    "widget-button",
    "widget-input",
    "widget-message-scroller",
    "widget-text-selection",
    "widget-tooltip",
    "widget-vlist",
] }
web-time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
