[package]
name = "argui-example-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Exact-source interactive examples for the Argui learning site"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argui = { workspace = true, features = [
    "i18n",
    "tasks",
    "widget-button",
    "widget-dialog",
    "widget-popover",
    "widget-range",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
argui-testing.workspace = true

[lints]
workspace = true
