[workspace]
members = ["docs-examples", "fake-ai-harness", "gpu-canvas"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ExtraBinoss/argui"

[workspace.dependencies]
argui = { path = "../crates/argui", version = "0.3.0" }
argui-testing = { path = "../crates/argui-testing", version = "0.3.0" }
web-time = "=1.1.0"
wasm-bindgen = "=0.2.127"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
opt-level = 0
debug = false
