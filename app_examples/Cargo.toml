[workspace]
members = ["astra-editor", "docs-examples", "dsl-live-demo", "dsl-virtual-list", "fake-ai-harness", "gpu-canvas", "spotlight", "widget-gallery-dsl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ExtraBinoss/argui"

[workspace.dependencies]
argui = { path = "../crates/argui", version = "0.3.2" }
argui-testing = { path = "../crates/argui-testing", version = "0.3.2" }
argui-effects = { path = "../crates/argui-effects", version = "0.3.2", features = ["scroll"] }
argui-showcase = { path = "../crates/argui-showcase", version = "0.3.2" }
web-time = "=1.1.0"
wasm-bindgen = "=0.2.127"
tree-sitter-highlight = "=0.26.7"
tree-sitter-rust = "=0.24.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
opt-level = 0
debug = false
