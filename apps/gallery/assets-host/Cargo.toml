[package]
name = "argui-gallery-assets"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ExtraBinoss/argui"
homepage = "https://extrabinoss.github.io/argui/"
readme = "../../../README.md"
description = "Embedded raster and SVG imports for the native Argui gallery"

[dependencies]
argui-media = { path = "../../../crates/argui-media", version = "0.3.3", features = ["media"] }
argui-paint = { path = "../../../crates/argui-paint", version = "0.3.3" }
argui-runtime = { path = "../../../crates/argui-runtime", version = "0.3.3" }

[workspace]
resolver = "3"
