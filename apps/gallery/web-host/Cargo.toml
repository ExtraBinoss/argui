[package]
name = "argui-app-web"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "WebAssembly host for the Argui gallery"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
argui-core = { path = "../../../crates/argui-core", version = "0.4.0" }
argui-media = { path = "../../../crates/argui-media", version = "0.4.0", features = ["media"] }
argui-paint = { path = "../../../crates/argui-paint", version = "0.4.0" }
argui-platform = { path = "../../../crates/argui-platform", version = "0.4.0" }
argui-render = { path = "../../../crates/argui-render", version = "0.4.0" }
argui-runtime = { path = "../../../crates/argui-runtime", version = "0.4.0", features = ["media"] }
argui-ui = { path = "../../../crates/argui-ui", version = "0.4.0" }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["console", "CustomEvent", "CustomEventInit", "Document", "Element", "Event", "EventTarget", "MediaQueryList", "Window"] }

[workspace]
resolver = "3"

[profile.dev]
debug = 0
