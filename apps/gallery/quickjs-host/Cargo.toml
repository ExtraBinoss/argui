[package]
name = "argui-gallery-quickjs"
version = "0.3.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ExtraBinoss/argui"
homepage = "https://extrabinoss.github.io/argui/"
readme = "../../../README.md"
description = "Native Argui gallery window driven by embedded QuickJS"

[features]
dev-tabler-icons = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argui-gallery-assets = { path = "../assets-host", version = "0.3.2" }
argui-core = { path = "../../../crates/argui-core", version = "0.3.2" }
argui-effects = { path = "../../../crates/argui-effects", version = "0.3.2", features = ["scroll"] }
argui-host = { path = "../../../crates/argui-host", version = "0.3.2", features = ["media"] }
argui-i18n = { path = "../../../crates/argui-i18n", version = "0.3.2" }
argui-paint = { path = "../../../crates/argui-paint", version = "0.3.2" }
argui-platform = { path = "../../../crates/argui-platform", version = "0.3.2" }
argui-render = { path = "../../../crates/argui-render", version = "0.3.2" }
argui-runtime = { path = "../../../crates/argui-runtime", version = "0.3.2" }
argui-ui = { path = "../../../crates/argui-ui", version = "0.3.2" }
rquickjs = "=0.14.0"
rquickjs-sys = { version = "=0.14.0", features = ["bindgen"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "android")'.dependencies]
argui-android = { path = "../../../crates/argui-android", version = "0.3.2" }
argui-text = { path = "../../../crates/argui-text", version = "0.3.2" }

[workspace]
resolver = "3"

# This manifest is its own workspace, so it cannot inherit the root profiles.
# Keep interactive desktop and Android debug builds optimized like the engine.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
opt-level = 0
debug = false
