[package]
name = "argui-web-host"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ExtraBinoss/argui"
description = "Browser WASM host for Argui's retained renderer and TSX bridge"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
argui-core = { path = "../../crates/argui-core", version = "0.3.3" }
argui-platform = { path = "../../crates/argui-platform", version = "0.3.3" }
argui-render = { path = "../../crates/argui-render", version = "0.3.3" }
argui-runtime = { path = "../../crates/argui-runtime", version = "0.3.3" }
argui-ui = { path = "../../crates/argui-ui", version = "0.3.3" }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["console", "CustomEvent", "CustomEventInit", "Document", "Element", "Event", "EventTarget", "MediaQueryList", "Window"] }

[workspace]
resolver = "3"
