<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Argui Widget Gallery</title>
    <link rel="icon" href="../favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fafafa;
        color: #191919;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #status {
        position: absolute;
        z-index: 1;
        background: inherit;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 32px;
        text-align: center;
        line-height: 1.7;
      }
      #status[hidden] {
        display: none;
      }
      #status a {
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #09090b;
          color: #fafafa;
        }
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Loading the Argui gallery…</div>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
