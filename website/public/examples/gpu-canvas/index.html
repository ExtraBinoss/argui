<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <title>Argui GPU Canvas Lab</title>
    <link rel="icon" href="../../favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #fafafa;
        color: #191919;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        touch-action: none;
      }
      html.argui-show-canvas-focus-ring canvas:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: -2px;
      }
      #status {
        position: absolute;
        z-index: 1;
        background: inherit;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
        text-align: center;
        line-height: 1.7;
      }
      #status[hidden] {
        display: none;
      }
      #status a {
        color: #1766cc;
      }
      #status h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      #status p,
      #status ol {
        max-width: 620px;
        margin: 0 auto 14px;
      }
      #status ol {
        text-align: left;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #09090b;
          color: #fafafa;
        }
      }
    </style>
  </head>
  <body
    data-module="./examples/gpu-canvas/pkg/argui_example_gpu_canvas.js"
    data-ready-label="Interactive GPU particle canvas"
  >
    <div id="status" role="status">Loading the retained GPU canvas…</div>
    <script type="module" src="../../preview-bridge.js"></script>
  </body>
</html>
