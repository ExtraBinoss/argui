<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <title>Argui documentation example</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #fafafa;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        touch-action: none;
      }
      #status {
        position: absolute;
        z-index: 1;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
        text-align: center;
        font:
          15px/1.6 system-ui,
          sans-serif;
      }
      #status[hidden] {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #09090b;
          color: #fafafa;
        }
      }
    </style>
  </head>
  <body data-module="./examples/docs/pkg/argui_example_docs.js">
    <div id="status" role="status">Compiling the lesson into pixels…</div>
    <script type="module" src="../../preview-bridge.js"></script>
  </body>
</html>
