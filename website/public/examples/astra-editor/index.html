<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <title>Astra Editor · Argui</title>
    <link rel="icon" href="../../favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #fff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        touch-action: none;
      }
      html.argui-show-canvas-focus-ring canvas:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: -2px;
      }
      #status {
        position: absolute;
        z-index: 1;
        inset: 0;
        display: grid;
        place-content: center;
        color: #71717a;
        font:
          500 14px/1.5 system-ui,
          sans-serif;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body data-module="./examples/astra-editor/pkg/argui_example_astra_editor.js">
    <div id="status" role="status">Opening Astra Editor…</div>
    <script type="module" src="../../preview-bridge.js"></script>
  </body>
</html>
