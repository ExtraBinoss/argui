plugins {
    id 'com.android.application'
}

abstract class CargoNdkBuild extends Exec {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def repositoryRoot = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def cargoManifest = new File(repositoryRoot, 'apps/gallery/quickjs-host/Cargo.toml')
def rustPackage = 'argui-gallery-quickjs'
def rustLibrary = 'libargui_gallery_quickjs.so'
def devTabler = providers.gradleProperty('arguiDevTabler').getOrElse('false').toBoolean()
def requestedAbis = providers.gradleProperty('arguiAbis')
        .orElse(providers.environmentVariable('ARGUI_ANDROID_ABIS'))
        .getOrElse('arm64-v8a,x86_64')
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def supportedAbis = ['arm64-v8a', 'x86_64']
if (requestedAbis.isEmpty() || requestedAbis.any { !supportedAbis.contains(it) }) {
    throw new GradleException("arguiAbis must contain arm64-v8a and/or x86_64; got ${requestedAbis}")
}

android {
    namespace = 'dev.argui.gallery'
    compileSdk = 36
    ndkVersion = '28.2.13676358'

    sourceSets {
        main {
            java.srcDir(new File(repositoryRoot, 'crates/argui-android/android/src/main/java'))
        }
    }

    defaultConfig {
        applicationId = 'dev.argui.solidgallery'
        manifestPlaceholders = [
                galleryLabel: 'Argui Solid Gallery',
                galleryActivity: 'dev.argui.gallery.EdgeToEdgeNativeActivity'
        ]
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.2.0'
        ndk {
            abiFilters(*requestedAbis)
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
        }
        release {
            minifyEnabled = false
        }
    }
}

def prepareJsGallery = tasks.register('prepareJsGallery', Exec) {
    workingDir repositoryRoot
    commandLine 'bun', 'run', 'build:gallery'
}

def registerRustBuild = { String variant, boolean optimized ->
    tasks.register("buildArguiRust${variant.capitalize()}", CargoNdkBuild) {
        workingDir repositoryRoot
        inputs.file(cargoManifest)
        inputs.file(new File(cargoManifest.parentFile, 'Cargo.lock'))
        inputs.dir(new File(repositoryRoot, 'crates'))
        inputs.dir(new File(repositoryRoot, 'crates/argui-android/android'))
        inputs.dir(new File(repositoryRoot, '.cargo'))
        dependsOn prepareJsGallery
        inputs.dir(new File(repositoryRoot, 'apps/gallery/quickjs-host/src'))
        inputs.dir(new File(repositoryRoot, 'apps/gallery/assets-host/src'))
        inputs.file(new File(repositoryRoot, 'apps/gallery/dist/gallery-core.mjs'))
        inputs.file(new File(repositoryRoot, 'apps/gallery/assets.generated.rs'))
        inputs.file(new File(repositoryRoot, 'packages/host/src/contract.generated.json'))
        inputs.property('androidAbis', requestedAbis)
        inputs.property('androidApiLevel', 26)
        inputs.property('androidNdkVersion', '28.2.13676358')
        inputs.property('releaseProfile', optimized)
        inputs.property('devTabler', devTabler)

        doFirst {
            def rustOutput = outputDirectory.get().asFile
            rustOutput.deleteDir()
            rustOutput.mkdirs()
            def command = ['cargo', 'ndk']
            requestedAbis.each { abi -> command.addAll(['-t', abi]) }
            command.addAll(['--platform', '26', '-o', rustOutput.absolutePath,
                            'build', '--locked', '--manifest-path', cargoManifest.absolutePath,
                            '--package', rustPackage, '--lib'])
            if (optimized) {
                command.add('--release')
            }
            if (devTabler && !optimized) {
                command.addAll(['--features', 'dev-tabler-icons'])
            }
            setCommandLine(command)
        }
        doLast {
            def rustOutput = outputDirectory.get().asFile
            requestedAbis.each { abi ->
                def galleryLibrary = new File(rustOutput, "${abi}/${rustLibrary}")
                if (!galleryLibrary.isFile()) {
                    throw new GradleException("cargo-ndk did not produce ${galleryLibrary}")
                }
                def nativeActivityLibrary = new File(rustOutput, "${abi}/libmain.so")
                if (!galleryLibrary.renameTo(nativeActivityLibrary)) {
                    throw new GradleException("could not rename ${galleryLibrary} to ${nativeActivityLibrary}")
                }
            }
        }
    }
}

registerRustBuild('debug', false)
registerRustBuild('release', true)

androidComponents {
    onVariants(selector().all()) { variant ->
        def task = tasks.named("buildArguiRust${variant.name.capitalize()}", CargoNdkBuild)
        variant.sources.jniLibs.addGeneratedSourceDirectory(task, { rustTask ->
            rustTask.outputDirectory
        })
    }
}
