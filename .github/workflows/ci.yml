name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: '6'
  BINARYEN_CORES: '2'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 512M
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks and Actionlint
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          curl -fsSL --retry 3 -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
      - name: Scan full Git history for secrets
        run: ./scripts/check-secrets.sh
      - name: Check workflows and release policy
        run: |
          actionlint
          python3 -m unittest discover -s tests/scripts

  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: ./scripts/install-linux-ci.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: quality-static
          cache-on-failure: true
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate registry manifests
        run: python3 scripts/release.py check
      - name: Run source, formatting, Clippy, Wasm, and public API checks
        run: ./scripts/check-quality-static.sh

  semver:
    name: Public API
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux build dependencies
        run: ./scripts/install-linux-ci.sh
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-semver-checks@0.49.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: semver
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compare publishable APIs with crates.io
        run: >-
          cargo semver-checks check-release --workspace
          --release-type major

  coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARGUI_NATIVE_TESTS: '1'
      ARGUI_COVERAGE_TOOLCHAIN: nightly-2026-08-21
      ARGUI_KEEP_COVERAGE_ARTIFACTS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free space for native and instrumented Rust artifacts
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install Linux build and private-display dependencies
        run: ./scripts/install-linux-ci.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install pinned coverage toolchain
        run: rustup toolchain install "$ARGUI_COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-nextest@0.9.143,cargo-llvm-cov@0.9.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: quality
          cache-on-failure: true
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate registry manifests
        run: python3 scripts/release.py check
      - name: Run the 85% coverage gate on a private display
        run: ./scripts/linux-hidden-display.sh ./scripts/check-coverage.sh
      - name: Save coverage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            target/coverage-gate.json
            target/coverage-report.json
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    name: Desktop compile (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            cache: windows
          - name: macOS
            runner: macos-15
            cache: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: desktop-${{ matrix.cache }}
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the complete workspace
        run: cargo check --workspace --all-targets --all-features --locked

  automation:
    name: Windowless TSX automation (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux native and private-display dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-ci.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: automation-${{ matrix.name }}
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the generated counter and run the same TSX test
        run: |
          bun install --frozen-lockfile
          cargo run --locked -p argui-cli -- init counter-native
          bun install --no-save
          if [ "$RUNNER_OS" = Windows ]; then exe=target/debug/argui.exe; else exe=target/debug/argui; fi
          if [ "$RUNNER_OS" = Linux ]; then
            ./scripts/linux-hidden-display.sh "$exe" test apps/counter-native tests/automation/counter.test.ts --out target/automation-counter
          else
            "$exe" test apps/counter-native tests/automation/counter.test.ts --out target/automation-counter
          fi
          bun scripts/check-automation-report.mjs target/automation-counter
      - name: Save automation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automation-${{ matrix.name }}
          path: target/automation-counter/
          retention-days: 7
          if-no-files-found: ignore

  gallery:
    name: Solid and React gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, build, and test TSX gallery
        run: |
          bun run check:ts
          bun run test:ts

  web:
    name: WebAssembly canvas app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: wasm-pack@0.15.0
      - name: Install verified WebAssembly optimizer
        run: |
          curl -fsSL --retry 3 -o /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
          echo 'b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db  /tmp/binaryen.tar.gz' | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp binaryen-version_131/bin/wasm-opt
          echo /tmp/binaryen-version_131/bin >> "$GITHUB_PATH"
      - name: Generate and verify a browser app
        run: |
          bun install --frozen-lockfile
          cargo run --locked -p argui-cli -- init counter-web
          bun install --no-save
          cd apps/counter-web
          ../../../target/debug/argui check
          ../../../target/debug/argui build release
          test -s dist/web/index.html
          test -n "$(find dist/web -name '*.wasm' -print -quit)"

  mobile:
    name: Mobile cross-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android,aarch64-apple-ios
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: mobile-cross-check
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Android engine
        run: |
          cargo check --locked --target aarch64-linux-android -p argui-android
      - name: Check iOS engine
        run: |
          cargo check --locked --target aarch64-apple-ios -p argui-ios

  android-package:
    name: Android APK and AAB
    needs: [mobile, gallery]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          targets: aarch64-linux-android
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: android-package
          cache-on-failure: true
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure the pinned Gradle wrapper and cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build the ARM64 debug APK and release AAB
        env:
          ARGUI_ANDROID_ABIS: arm64-v8a
        run: |
          ./scripts/android-gallery.sh apk --no-daemon
          ./scripts/android-gallery.sh aab --no-daemon
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f mobile/android/app/build/outputs/bundle/release/app-release.aab
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libmain.so'
          unzip -l mobile/android/app/build/outputs/bundle/release/app-release.aab | grep -F 'base/lib/arm64-v8a/libmain.so'
      - name: Upload installable Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: argui-solid-gallery-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  packages:
    name: Crates.io archives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: ./scripts/install-linux-ci.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: packages
          cache-on-failure: true
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Package and compile every publishable crate archive
        run: python3 scripts/release.py package

  release:
    name: Publish crates and GitHub release
    needs: [security, quality, semver, coverage, desktop, automation, gallery, web, mobile, android-package, packages]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'ExtraBinoss/argui' && github.actor == 'ExtraBinoss' &&
      contains(github.event.head_commit.message, '[PUBLISH]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: crates-io
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install native build dependencies
        run: ./scripts/install-linux-ci.sh
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release
          cache-targets: false
          cache-directories: ${{ env.SCCACHE_DIR }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the version and publish missing crates
        env:
          PUBLISH_BASE: ${{ github.event.before }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_REGISTRY_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --base "$PUBLISH_BASE"

  cli-release:
    name: CLI ${{ matrix.target }}
    needs: release
    if: needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98.0'
          targets: ${{ matrix.target }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Verify CLI version is newer than previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ matrix.python }} -m scripts.cli_release check --target ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release --locked -p argui-cli --target ${{ matrix.target }}
      - name: Package and upload verified CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ${{ matrix.python }} -m scripts.cli_release package --target ${{ matrix.target }}
          ${{ matrix.python }} -m scripts.cli_release upload --target ${{ matrix.target }}
