[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ExtraBinoss/argui"
homepage = "https://extrabinoss.github.io/argui/"
readme = "README.md"

[workspace.dependencies]
argui = { path = "crates/argui", version = "0.3.1" }
argui-android = { path = "crates/argui-android", version = "0.3.1" }
argui-accessibility = { path = "crates/argui-accessibility", version = "0.3.1" }
argui-animation = { path = "crates/argui-animation", version = "0.3.1" }
argui-core = { path = "crates/argui-core", version = "0.3.1" }
argui-devtools = { path = "crates/argui-devtools", version = "0.3.1" }
argui-effects = { path = "crates/argui-effects", version = "0.3.1" }
argui-layout = { path = "crates/argui-layout", version = "0.3.1" }
argui-image = { path = "crates/argui-image", version = "0.3.1" }
argui-i18n = { path = "crates/argui-i18n", version = "0.3.1" }
argui-ios = { path = "crates/argui-ios", version = "0.3.1" }
argui-inspect = { path = "crates/argui-inspect", version = "0.3.1" }
argui-paint = { path = "crates/argui-paint", version = "0.3.1" }
argui-platform = { path = "crates/argui-platform", version = "0.3.1" }
argui-render = { path = "crates/argui-render", version = "0.3.1" }
argui-showcase = { path = "crates/argui-showcase" }
argui-runtime = { path = "crates/argui-runtime", version = "0.3.1" }
argui-text = { path = "crates/argui-text", version = "0.3.1" }
argui-testing = { path = "crates/argui-testing", version = "0.3.1" }
argui-theme = { path = "crates/argui-theme", version = "0.3.1" }
argui-ui = { path = "crates/argui-ui", version = "0.3.1" }
argui-updater = { path = "crates/argui-updater", version = "0.3.1" }
argui-vector = { path = "crates/argui-vector", version = "0.3.1" }
argui-widgets = { path = "crates/argui-widgets", version = "0.3.1" }
argui-webview = { path = "crates/argui-webview", version = "0.3.1" }

bytemuck = { version = "=1.25.2", features = ["derive"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "=0.22.1"
cosmic-text = { version = "=0.19.0", default-features = false }
futures-util = "=0.3.34"
fluent-bundle = "=0.16.0"
fluent-langneg = "=0.13.1"
dioxus-devtools = "=0.7.10"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
pollster = "=1.0.1"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
thiserror = "=2.0.20"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
semver = { version = "=1.0.28", features = ["serde"] }
minisign-verify = "=0.2.5"
tempfile = "=3.27.0"
self-replace = "=1.5.0"
flate2 = "=1.1.9"
tar = "=0.4.46"
tracing = "=0.1.44"
wgpu = "=30.0.1"
winit = "=0.30.13"
wasm-bindgen-futures = "=0.4.77"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
web-time = "=1.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sysinfo = { version = "=0.37.2", default-features = false }
unicode-segmentation = "=1.13.3"
unic-langid = { version = "=0.9.6", features = ["macros"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
tray-icon = { version = "=0.24.2", default-features = false }
global-hotkey = "=0.8.0"
winresource = "=0.1.31"
usvg = { version = "=0.48.1", default-features = false }
resvg = { version = "=0.48.1", default-features = false }
icondata_core = "=0.1.0"
icondata_tb = "=0.1.0"
epaint_default_fonts = "=0.31.1"
accesskit = "=0.24.1"
accesskit_consumer = "=0.38.0"
accesskit_winit = "=0.33.2"
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }
windows = "=0.62.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = "warn"

# Keep `cargo run` debuggable while compiling the hot UI pipeline enough to
# make interactive performance representative of the engine rather than LLVM's
# unoptimized code generation.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = false

# Tests favor fast compilation and small artifacts. Interactive performance is
# measured with the development profile above, not by optimizing test binaries.
[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
opt-level = 0
debug = false
