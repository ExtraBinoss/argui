[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argui = { path = "crates/argui" }
argui-accessibility = { path = "crates/argui-accessibility" }
argui-animation = { path = "crates/argui-animation" }
argui-core = { path = "crates/argui-core" }
argui-devtools = { path = "crates/argui-devtools" }
argui-effects = { path = "crates/argui-effects" }
argui-layout = { path = "crates/argui-layout" }
argui-image = { path = "crates/argui-image" }
argui-inspect = { path = "crates/argui-inspect" }
argui-paint = { path = "crates/argui-paint" }
argui-platform = { path = "crates/argui-platform" }
argui-render = { path = "crates/argui-render" }
argui-showcase = { path = "crates/argui-showcase" }
argui-runtime = { path = "crates/argui-runtime" }
argui-text = { path = "crates/argui-text" }
argui-theme = { path = "crates/argui-theme" }
argui-ui = { path = "crates/argui-ui" }
argui-vector = { path = "crates/argui-vector" }
argui-widgets = { path = "crates/argui-widgets" }
argui-webview = { path = "crates/argui-webview" }

bytemuck = { version = "=1.25.2", features = ["derive"] }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
base64 = "=0.22.1"
cosmic-text = { version = "=0.19.0", default-features = false }
futures-util = "=0.3.31"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
pollster = "=1.0.1"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
thiserror = "=2.0.20"
tracing = "=0.1.44"
wgpu = "=30.0.1"
winit = "=0.30.13"
wasm-bindgen-futures = "=0.4.77"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
web-time = "=1.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-segmentation = "=1.13.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
tray-icon = { version = "=0.24.2", default-features = false }
winresource = "=0.1.31"
usvg = { version = "=0.48.1", default-features = false }
resvg = { version = "=0.48.1", default-features = false }
icondata_core = "=0.1.0"
icondata_tb = "=0.1.0"
accesskit = "=0.24.1"
accesskit_consumer = "=0.38.0"
accesskit_winit = "=0.33.2"
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }
windows = "=0.62.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = "warn"

# Keep `cargo run` debuggable while compiling the hot UI pipeline enough to
# make interactive performance representative of the engine rather than LLVM's
# unoptimized code generation.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Tests favor fast compilation and small artifacts. Interactive performance is
# measured with the development profile above, not by optimizing test binaries.
[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
opt-level = 0
debug = false
