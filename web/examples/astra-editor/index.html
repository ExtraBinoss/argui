<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <title>Astra Editor · Argui</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background: #fff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        touch-action: none;
      }
      html.argui-show-canvas-focus-ring canvas:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: -2px;
      }
      #status {
        position: absolute;
        z-index: 1;
        inset: 0;
        display: grid;
        place-content: center;
        color: #71717a;
        font: 500 14px/1.5 system-ui, sans-serif;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Opening Astra Editor…</div>
    <script type="module">
      import '../../browser-shortcuts.js'
      import init from './pkg/argui_example_astra_editor.js'

      const status = document.querySelector('#status')
      addEventListener('argui:renderer-state', (event) => {
        if (event.detail?.state === 'ready') status.hidden = true
        if (event.detail?.state === 'error') status.textContent = 'Astra Editor could not start.'
      })
      try {
        await init()
      } catch (error) {
        console.error(error)
        status.textContent = 'WebGPU is unavailable in this browser.'
      }
    </script>
  </body>
</html>
